services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    ports:
      # VPS에서 DB가 외부에 열리지 않도록 로컬 루프백에만 바인딩한다.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 운영은 서버의 공용 Postgres를 쓴다 (ADR-0008). 로컬 개발에서만 띄운다.
    profiles: ["dev"]

  # 1회성: 스키마를 반영하고 종료한다. standalone 이미지에는 prisma CLI가 없어서 deps 단계를 쓴다.
  # 운영은 CI가 GHCR에 올린 이미지를 IMAGE_TAG(커밋 SHA)로 pull한다 (ADR-0011).
  migrate:
    image: ghcr.io/himchan94/himchan-blog-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      target: deps
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD:-blog}@postgres:5432/${POSTGRES_DB:-blog}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks: [default, postgres]
    profiles: ["app"]

  app:
    image: ghcr.io/himchan94/himchan-blog:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD:-blog}@postgres:5432/${POSTGRES_DB:-blog}?schema=public
      # 공용 S3 저장소(Garage)는 이 compose 밖에서 돈다. 컨테이너 이름으로 붙는다 (ADR-0009).
      S3_URL: http://garage:3900
    ports:
      # 호스트 nginx만 붙도록 루프백에 바인딩한다 (ADR-0008).
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [default, postgres, s3]
    profiles: ["app"]

volumes:
  postgres-data:

networks:
  # 공용 Postgres가 붙어 있는 외부 network. 로컬은 dev profile의 postgres를 default network로 찾는다.
  postgres:
    external: true
    name: ${POSTGRES_NETWORK:-postgres}
  s3:
    external: true
    name: ${S3_NETWORK:-garage}
